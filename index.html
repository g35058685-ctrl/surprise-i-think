<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>👀👀</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=DM+Sans:wght@400;500&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9dc;--ink:#4a1f2a;--accent:#7a2e3a;--tray:#e8d6c4;--board:#fbf6ee;--seam:#fff;--btn:#7a2e3a;--btntxt:#fbf1e6;--sage:#8fa68b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1519;--ink:#f3e3dc;--accent:#e8a3ad;--tray:#3a1f25;--board:#341a20;--btn:#e8a3ad;--btntxt:#2a1519;--sage:#9fb69b}}
:root[data-theme="dark"]{--bg:#2a1519;--ink:#f3e3dc;--accent:#e8a3ad;--tray:#3a1f25;--board:#341a20;--btn:#e8a3ad;--btntxt:#2a1519;--sage:#9fb69b}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:440px;margin:0 auto;padding:14px 16px 20px;text-align:center}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:2.6rem;line-height:1;margin:4px 0 6px;color:var(--accent)}
p.hint{margin:0 0 10px;font-size:.92rem;line-height:1.4;opacity:.85}
svg{display:block;width:100%;height:auto;max-height:calc(100svh - 40px);margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.bar{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:500;background:var(--btn);color:var(--btntxt);border:0;border-radius:999px;padding:9px 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
#count{font-size:.9rem;min-width:7.5em}
.pc{cursor:grab}
.pc path{stroke:var(--seam);stroke-width:2;stroke-linejoin:round;transition:stroke-opacity .8s}
#gp .pc.lift{cursor:grabbing}
#gl .pc{cursor:default}
#gl .pc path{stroke-opacity:.5}
svg.won #gl .pc path{stroke-opacity:0}
#peek{transition:opacity .4s;opacity:0;pointer-events:none}
#msg{display:none;margin:14px 0 0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:1.5rem;color:var(--accent)}
body.done #msg{display:block}
.heart{position:fixed;bottom:-30px;color:var(--accent);pointer-events:none;z-index:20;animation:rise 3.4s ease-in forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(18deg);opacity:0}}
svg{transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
#frame{opacity:0;transition:opacity .7s ease .15s}
#gh,#tr{transition:opacity .6s}
svg.won #gh,svg.won #tr{opacity:0}
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden;transition:opacity .6s,transform .6s}
#intro.out{opacity:0;transform:scale(1.06);pointer-events:none}
#intro .card{position:relative;z-index:1;text-align:center;max-width:420px}
#ih{font-family:'Fredoka','DM Sans',system-ui,sans-serif;font-weight:600;font-size:2.1rem;line-height:1.3;margin:0 0 28px;color:var(--ink)}
.w{display:inline-block;opacity:0;animation:pop .7s cubic-bezier(.3,1.5,.5,1) var(--d) both,bob 2.2s ease-in-out calc(var(--d) + .7s) infinite}
.w.hl{color:var(--accent);font-size:1.3em}
.w.sm{font-style:italic;font-weight:500;opacity:0}
#go{font-family:'Fredoka','DM Sans',system-ui,sans-serif;font-size:1.2rem;padding:12px 30px;opacity:0;animation:pop .6s cubic-bezier(.3,1.5,.5,1) var(--d) both,pulse 1.6s ease-in-out calc(var(--d) + .6s) infinite}
@keyframes pop{0%{transform:translateY(34px) scale(.3) rotate(-10deg);opacity:0}60%{transform:translateY(-8px) scale(1.15) rotate(3deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
.fl{position:absolute;bottom:-50px;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes celebrate{0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,170,190,0))}35%{transform:scale(1.035);filter:drop-shadow(0 0 24px rgba(255,170,190,.95))}100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,170,190,0))}}
.spark{position:fixed;left:0;top:0;pointer-events:none;z-index:20;line-height:1}
@media (prefers-reduced-motion:reduce){.heart,.spark{animation:none;display:none}svg.pop{animation:none}svg,#frame,#gh,#tr{transition:none}.w,#go{animation:none;opacity:1}.fl{display:none}}
</style>
</head>
<body>
<div id="intro"><div id="fl"></div><div class="card"><h2 id="ih"></h2><button id="go" type="button">opin!!</button></div></div>

function end(){
  if(!drag) return; const p=drag.p; drag=null; p.g.classList.remove('lift');
  if(Math.hypot(p.tx,p.ty)<Math.min(pw,ph)*.3){
    p.tx=p.ty=0; place(p); p.done=true; gl.appendChild(p.g); placed++; counter();
    if(placed===N) win();
  }
}
svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);

function burst(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  // light sweep across the finished photo
  const grad=el('linearGradient',{id:'shineG',x1:0,y1:0,x2:1,y2:0},defs);
  el('stop',{offset:0,'stop-color':'#fff','stop-opacity':0},grad);
  el('stop',{offset:.5,'stop-color':'#fff','stop-opacity':.8},grad);
  el('stop',{offset:1,'stop-color':'#fff','stop-opacity':0},grad);
  const cp=el('clipPath',{id:'bclip'},defs); el('rect',{x:0,y:0,width:W,height:H,rx:6},cp);
  const sg=el('g',{'clip-path':'url(#bclip)','pointer-events':'none'},svg);
  const poly=el('polygon',{points:`-160,0 -60,0 -100,${H} -200,${H}`,fill:'url(#shineG)'},sg);
  const an=el('animateTransform',{attributeName:'transform',type:'translate',from:'0 0',to:`${W+260} 0`,dur:'1.3s',begin:'indefinite',fill:'freeze'},poly);
  setTimeout(()=>{an.beginElement();setTimeout(()=>sg.remove(),1600)},250);
  // confetti burst from the middle of the board
  const b=svg.getBoundingClientRect(), cx=b.left+b.width/2, cy=b.top+(H/2)/VH*b.height;
  const chars=['♥','♥','✦','✿','♥'], cols=['#e8758a','#7a2e3a','#f1c9d0','#8fa68b','#f6d27a','#ffffff'];
  for(let i=0;i<46;i++){
    const s=document.createElement('span'); s.className='spark';
    s.textContent=chars[i%chars.length]; s.style.color=cols[i%cols.length]; s.style.fontSize=rnd(16,34)+'px';
    s.style.textShadow='0 1px 3px rgba(0,0,0,.25)';
    document.body.appendChild(s);
    const a=rnd(0,Math.PI*2), r=rnd(110,280), dx=Math.cos(a)*r, dy=Math.sin(a)*r-60, rot=rnd(-240,240);
    const o=`translate(${cx}px,${cy}px)`;
    s.animate([
      {transform:`${o} translate(-50%,-50%) scale(.2) rotate(0deg)`,opacity:1},
      {transform:`${o} translate(${dx}px,${dy}px) scale(1.1) rotate(${rot}deg)`,opacity:1,offset:.55},
      {transform:`${o} translate(${dx*1.1}px,${dy+170}px) scale(.8) rotate(${rot*1.4}deg)`,opacity:0}
    ],{duration:rnd(1700,2600),easing:'cubic-bezier(.15,.7,.3,1)',delay:rnd(0,250),fill:'forwards'}).onfinish=()=>s.remove();
  }
}
function win(){
  svg.classList.add('won');
  try{snd.muted=false;snd.volume=1;snd.currentTime=0;const pr=snd.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const dpr=Math.min(window.devicePixelRatio||1,1.5), w=innerWidth, h=innerHeight, k=Math.min(Math.max(Math.min(w,h)/520,.7),1.6);
  const cv=document.createElement('canvas'); cv.width=w*dpr; cv.height=h*dpr;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40';
  document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols=['#7a2e3a','#e8758a','#f1c9d0','#8fa68b','#f6d27a','#ffffff','#c94f6d','#ffb3c1','#ffd9a0'];
  const ps=[];
  const spawn=(x,y,ang,spread,smin,smax)=>{
    const a=ang+rnd(-spread,spread), s=rnd(smin,smax)*k, shape=Math.random();
    ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rnd(0,6.3),vr:rnd(-.3,.3),fl:rnd(0,6.3),vf:rnd(.1,.35),
      w:shape<.2?rnd(3,5)*k:rnd(8,15)*k,h:shape<.2?rnd(18,30)*k:rnd(5,9)*k,r:rnd(3,5.5)*k,shape:shape<.2?0:shape<.75?1:2,col:cols[(Math.random()*cols.length)|0]});
  };
  const b=svg.getBoundingClientRect(), cx=b.left+b.width/2, cy=b.top+((H/2+20)/(VH+40))*b.height;
  const wave=()=>{
    for(let i=0;i<110;i++){spawn(0,h,-Math.PI/3,.45,16,40);spawn(w,h,-2*Math.PI/3,.45,16,40)}
  };
  wave();
  for(let i=0;i<180;i++) spawn(cx,cy,rnd(0,6.28),0,8,26);
  setTimeout(wave,500); setTimeout(wave,1100);
  setTimeout(()=>{for(let i=0;i<160;i++) spawn(cx,cy,rnd(0,6.28),0,8,26)},900);
  const t0=performance.now(); let last=t0;
  (function tick(now){
    const dt=Math.min((now-last)/16.67,3); last=now; const t=now-t0;
    if(t<3800) for(let i=0;i<5;i++) spawn(rnd(0,w),-20,Math.PI/2,.6,1,4);
    ctx.clearRect(0,0,w,h);
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];
      p.vx*=Math.pow(.985,dt); p.vy=p.vy*Math.pow(.985,dt)+.33*k*dt; if(p.vy>5.5*k) p.vy=5.5*k;
      p.x+=p.vx*dt+Math.sin(p.fl)*.6*k; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.fl+=p.vf*dt;
      if(p.y>h+40||p.x<-80||p.x>w+80){ps.splice(i,1);continue}
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
      if(p.shape===1){ctx.scale(1,Math.cos(p.fl)); ctx.beginPath(); ctx.arc(0,0,p.r,0,6.3); ctx.fill()}
      else {ctx.scale(1,Math.cos(p.fl)); ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
      ctx.restore();
    }
    if(t<4200||ps.length) requestAnimationFrame(tick); else cv.remove();
  })(t0);
}
scatter();
(function(){
  const intro=document.getElementById('intro'), h=document.getElementById('ih'), go=document.getElementById('go'), fl=document.getElementById('fl');
  const words='congrats on getting a high score baobao! here’s your surprise heh'.split(' ');
  words.forEach((t,i)=>{
    const s=document.createElement('span'); s.className='w'+(t==='baobao!'?' hl':t==='heh'?' sm':'');
    s.textContent=t; s.style.setProperty('--d',(0.25+i*0.16).toFixed(2)+'s');
    h.appendChild(s); h.appendChild(document.createTextNode(' '));
  });
  go.style.setProperty('--d',(0.25+words.length*0.16+0.3).toFixed(2)+'s');
  ['🎉','✨','💖','🎊','⭐','💫','🎁','💕','✨','🎉','💖','🎊'].forEach(e=>{
    const s=document.createElement('span'); s.className='fl'; s.textContent=e;
    s.style.left=rnd(2,92)+'%'; s.style.fontSize=rnd(20,36)+'px';
    s.style.animationDuration=rnd(6,11)+'s'; s.style.animationDelay=(-rnd(0,8))+'s';
    fl.appendChild(s);
  });
  go.onclick=()=>{unlock();intro.classList.add('out');setTimeout(()=>intro.remove(),700)};
})();
</script>
